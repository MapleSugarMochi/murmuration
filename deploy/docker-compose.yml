# Local production-like stack: docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: murmuration
      POSTGRES_PASSWORD: murmuration
      POSTGRES_DB: murmuration
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U murmuration']
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://murmuration:murmuration@postgres:5432/murmuration
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me-please}
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
