# Fly.io deployment. Before the first deploy:
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
#   fly postgres create && fly postgres attach <db-app>   # sets DATABASE_URL
#   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)
# Then: fly deploy --config deploy/fly.toml
app = 'tandem'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # One instance: every document is served by a single process (ADR 0004).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    path = '/readyz'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[metrics]
  port = 8080
  path = '/metrics'
