# Fly.io deployment, run from the repository root. See docs/deploy.md.
app = 'murmuration-xd'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  # Metrics stay on a private port that Fly scrapes; the public port has none.
  METRICS_PORT = '9091'
  ALLOWED_ORIGINS = 'https://murmuration-xd.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # One instance: every document is served by a single process (ADR 0004).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    path = '/readyz'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[metrics]
  port = 9091
  path = '/metrics'
